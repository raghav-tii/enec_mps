# Installs tensnet from this repository (pip install -e .).
[project]
name = "tensnet"
version = "0.1.4"
authors = [{ name = "Raghavendra P", email = "rdheeeraj@gmail.com" }]
description = "Matrix product states and operators, finite-difference MPOs and AMEn/DMRG solvers for the QCFD 21-rod bundle solver"
readme = "tensnet/README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "einops"]

[tool.setuptools]
packages = ["tensnet", "tensnet.linalg", "tensnet.networks", "tensnet.utils"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tensnet/linalg/_wall_closure_tables.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E741",   # l, O, I as names: math notation (u, v, l for cores)
    "B023",   # loop-variable closures are used immediately
    "SIM108", # ternary only when it reads better
    "UP031",  # printf-style formatting in tensnet error messages
    "B905",   # zip(strict=) needs Python 3.10 semantics everywhere; lengths match by construction
    "C408",   # dict(...) with keyword names reads better for config records
]

[tool.ruff.lint.per-file-ignores]
"tensnet/**" = ["E501", "B006", "B008", "B028"]  # long docstring lines; defaults kept for API compatibility
"tensnet/**/__init__.py" = ["F403"]
"report/*.py" = ["E402"]   # sys.path is set by _paths before the solver modules are imported
"scripts/*.py" = ["E402"]
"tutorial/*.ipynb" = ["E402", "E501"]  # sys.path is set in the first cell; long strings are output text

[tool.ruff.lint.isort]
known-first-party = ["tensnet"]
known-local-folder = [
    "_paths", "star", "star_vtk", "bundle_simulation", "chorin_projection",
    "rod_forces", "dense_projection_check", "uncompressed_twin",
]
